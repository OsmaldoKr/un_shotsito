name: un_shotsito
description: "Un Shotsito - App de juegos de beber by FratresPixel"
publish_to: 'none'

version: 1.0.0

environment:
  sdk: ">=3.9.2 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  logger: ^2.0.2
  cupertino_icons: ^1.0.8
  flutter_svg: ^2.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/images/Buttons/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/logo_UnShotsito.png"
  adaptive_icon_background: "#ffffff"
  adaptive_icon_foreground: "assets/images/logo_UnShotsito.png"
