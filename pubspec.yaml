name: un_shotsito
description: "UnShotsito - Juego de retos desarrollado por FratresPixel"
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.12.2 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_svg: ^2.2.3

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - assets/images/

flutter_launcher_icons:
  android: true
  ios: true
  web:
    generate: false
  windows:
    generate: true
  macos:
    generate: true

  image_path: "assets/images/logo_UnShotsito.png"

  adaptive_icon_background: "#F1E9DF"
  adaptive_icon_foreground: "assets/images/logo_UnShotsito.png"

  adaptive_icon_monochrome: "assets/images/logo_UnShotsito.png"

  remove_alpha_ios: true

  min_sdk_android: 21
