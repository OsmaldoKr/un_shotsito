name: un_shotsito
description: "UnShotsito - Juego de retos desarrollado por FratresPixel"
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.12.2 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_svg: ^2.2.3
  http: ^1.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - assets/images/

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true

  image_path: "assets/images/logo_UnShotsito.png"
  image_path_android: "assets/images/logo_UnShotsito.png"
  image_path_ios: "assets/images/logo_UnShotsito.png"

  adaptive_icon_background: "#F1E9DF"
  adaptive_icon_foreground: "assets/images/logo_UnShotsito.png"
  adaptive_icon_foreground_inset: 16

  remove_alpha_ios: true
  background_color_ios: "#F1E9DF"

  min_sdk_android: 21

  web:
    generate: false

  windows:
    generate: true
    image_path: "assets/images/logo_UnShotsito.png"
    icon_size: 256

  macos:
    generate: true
    image_path: "assets/images/logo_UnShotsito.png"
